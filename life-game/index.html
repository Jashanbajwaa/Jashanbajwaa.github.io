<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7faf6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Life Game" />
    <link rel="icon" href="data:," />
    <title>Life Game</title>
    <style>
      /* Life Game wearing the Daily Nutrition Tracker's design system:
         bright soothing light-green palette, rounded sans, pale-green
         hero panels, white rounded cards. Light only, like his trackers. */
      :root {
        color-scheme: light;
        --bg: #f7faf6;
        --surface: #ffffff;
        --surface-alt: #eef5ee;
        --text: #19372e;
        --dim: #66736d;
        --border: #d9e4da;
        --accent: #2f755f;
        --accent-strong: #1f5d4b;
        --accent-soft: #e7f2ea;
        --warm: #e88a5a;
        --danger: #a54b33;
        --amber: #b26a21;
        --amber-soft: #fdf1de;
        --shadow: 0 10px 30px rgba(41, 78, 64, 0.08);
        --fitness: #c96f3b;
        --nutrition: #2f755f;
        --spending: #b57f22;
        --french: #3e6b9e;
        --journal: #7a5c9e;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html { -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Avenir Next", "Nunito Sans", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.45;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
        overscroll-behavior-y: none;
        touch-action: manipulation;
      }
      button, input, select, textarea { font: inherit; color: inherit; }
      /* iOS Safari zooms the whole page in — and leaves it zoomed — when a
         focused field's text is under 16px. Every field renders at 16px so
         tapping one never changes the page scale. */
      input, select, textarea { font-size: 16px; }
      button, a, label { touch-action: manipulation; }
      button { cursor: pointer; }
      :focus-visible { outline: 3px solid rgba(47, 117, 95, .25); outline-offset: 2px; }
      .page-frame { width: min(760px, 100%); margin: 0 auto; padding: 14px 14px 48px; }
      @media (min-width: 720px) { .page-frame { padding: 24px 20px 64px; } }

      /* ---------- shared chrome (from the nutrition app) ---------- */
      .back-button, .text-button, .target-button {
        border: 0; background: transparent; color: var(--accent-strong);
        font-weight: 700; cursor: pointer; padding: 10px 2px; min-height: 40px; white-space: nowrap;
      }
      .mini-label { font-size: 11px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; color: var(--dim); margin: 0; }
      .panel-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 4px 14px rgba(31, 71, 57, .04); padding: 18px; }
      .list-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 4px 14px rgba(31, 71, 57, .04); overflow: hidden; }
      .pill-button {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        min-height: 44px; border: 0; border-radius: 999px; padding: 10px 18px;
        font-size: 14px; font-weight: 800; color: white; cursor: pointer;
      }
      .pill-button:disabled { opacity: .55; }
      .pill-button.ghost { background: var(--surface); color: var(--accent-strong); border: 1px solid var(--border); }
      .lg-input {
        width: 100%; min-height: 46px; border: 1px solid var(--border); border-radius: 12px;
        background: var(--surface); color: var(--text); padding: 10px 12px; outline: none;
      }
      .lg-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47, 117, 95, .12); }
      .lg-label { display: grid; gap: 6px; color: var(--dim); font-size: 12px; font-weight: 700; }
      .message { width: 100%; border: 0; border-radius: 12px; background: #fff0e8; color: #7c3d25; padding: 10px 12px; text-align: left; margin-bottom: 10px; font-size: 14px; cursor: pointer; }
      .loading, .error-state { background: var(--surface); border-radius: 16px; padding: 20px; color: var(--dim); }
      .error-state { color: var(--danger); }
      .status-chip { display: inline-block; border-radius: 999px; padding: 5px 10px; font-size: 11px; font-weight: 750; }
      .section-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 30px 2px 14px; }
      .section-heading h2 { font-size: 24px; line-height: 1.1; letter-spacing: -.025em; margin: 0; font-weight: 750; }
      .section-heading p { color: var(--dim); font-size: 13px; line-height: 1.45; margin: 6px 0 0; max-width: 330px; }
      .screen-title { font-size: 26px; font-weight: 750; letter-spacing: -.025em; margin: 4px 0 0; }
      .screen-title .rule { display: block; height: 4px; width: 40px; border-radius: 999px; margin-top: 6px; }

      /* ---------- board / hero ---------- */
      .board-date { text-align: center; color: var(--dim); font-size: 13px; font-weight: 600; margin: 6px 0 14px; }
      .dashboard-hero { background: #dfece0; border-radius: 28px 28px 14px 28px; padding: 22px; box-shadow: var(--shadow); }
      @media (min-width: 720px) { .dashboard-hero { padding: 30px; } }
      .hero-flex { display: flex; align-items: center; gap: 20px; }
      .score-ring { position: relative; flex: 0 0 auto; }
      .score-ring .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .score-ring .ring-num { line-height: 1; font-weight: 750; letter-spacing: -.02em; }
      .score-ring .ring-of { margin-top: 4px; font-size: 12px; color: var(--dim); }
      .progress-track { height: 11px; background: rgba(25, 55, 46, .12); border-radius: 999px; margin-top: 22px; overflow: hidden; }
      .progress-fill { height: 100%; background: var(--accent); border-radius: inherit; transition: width .2s ease; }
      .spotlight { margin-top: 12px; }
      .world-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; box-shadow: 0 4px 14px rgba(31, 71, 57, .04); }
      .world-card-main { display: block; width: 100%; border: 0; background: transparent; text-align: left; padding: 16px 18px 14px; cursor: pointer; }
      .world-card-foot { border-top: 1px solid var(--border); padding: 12px 18px 14px; display: flex; align-items: center; gap: 12px; }
      .open-app-button { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 800; color: white; cursor: pointer; white-space: nowrap; }
      .coming-soon-chip { display: inline-flex; align-items: center; border-radius: 999px; background: var(--surface-alt); color: var(--dim); padding: 9px 14px; font-size: 12px; font-weight: 750; white-space: nowrap; }
      .foot-note { color: var(--dim); font-size: 13px; line-height: 1.45; }
      .world-head { display: flex; align-items: flex-start; gap: 12px; }
      .world-bar { margin-top: 4px; display: block; height: 44px; width: 6px; flex: 0 0 6px; border-radius: 999px; }
      .world-name-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
      .world-name { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
      .world-score { font-size: 24px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
      .win-bar { margin-top: 12px; height: 7px; overflow: hidden; border-radius: 999px; background: #e5ece6; }
      .win-bar i { display: block; height: 100%; border-radius: inherit; }
      .today-mark { display: inline-flex; height: 24px; width: 24px; align-items: center; justify-content: center; border-radius: 999px; color: white; flex: 0 0 auto; }
      .today-mark.open { background: transparent; border: 2px dashed var(--border); }
      .board-grid { display: flex; flex-direction: column; gap: 12px; }
      .duo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
      .duo-grid .world-card-main { height: 100%; }
      .signout-row { margin-top: 28px; text-align: center; }

      /* ---------- day dots / detail ---------- */
      .dot-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
      .dot-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 34px; }
      .dot-cell .dl { font-size: 10px; color: var(--dim); }
      .day-dot { display: block; height: 16px; width: 16px; border-radius: 999px; }
      .stat-list { margin-top: 6px; }
      .stat-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-top: 1px solid #edf1ed; font-size: 14.5px; }
      .stat-row:first-child { border-top: 0; }
      .stat-row .sl { color: var(--dim); }
      .stat-row .sv { font-weight: 650; text-align: right; }

      /* ---------- nutrition (the original app's own classes) ---------- */
      .day-nav { display: grid; grid-template-columns: 46px 1fr 46px; align-items: center; gap: 8px; margin: 6px 0 14px; }
      .nav-arrow { height: 42px; border: 0; border-radius: 14px; background: transparent; color: var(--accent); font-size: 22px; cursor: pointer; }
      .nav-arrow:disabled { opacity: .28; cursor: default; }
      .date-control { display: grid; justify-items: center; gap: 1px; min-height: 48px; font-weight: 700; cursor: pointer; }
      .date-control span { font-size: 13px; line-height: 1.1; }
      .date-control input { display: block; width: 182px; border: 0; background: transparent; color: var(--dim); text-align: center; font-size: 16px; padding: 1px 4px; cursor: pointer; }
      .sticky-totals { position: sticky; top: max(8px, env(safe-area-inset-top)); z-index: 20; width: fit-content; max-width: 100%; margin: 0 0 10px auto; display: flex; align-items: center; gap: 9px; border: 1px solid var(--border); border-radius: 999px; background: rgba(255,255,255,.96); box-shadow: 0 7px 22px rgba(31,71,57,.12); padding: 8px 11px; font-size: 10px; color: var(--dim); white-space: nowrap; }
      .sticky-totals strong { color: var(--text); font-size: 13px; }
      .week-overview { border: 1px solid var(--border); border-radius: 20px; background: var(--surface); padding: 18px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(31, 71, 57, .04); touch-action: pan-y; }
      .week-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .week-title-row h2 { font-size: 21px; line-height: 1.1; letter-spacing: -.025em; margin: 0; font-weight: 750; }
      .week-title-row p { color: var(--dim); font-size: 12px; margin: 4px 0 0; }
      .week-title-row > span { border-radius: 999px; background: var(--surface-alt); color: var(--accent-strong); padding: 6px 9px; font-size: 11px; font-weight: 750; white-space: nowrap; }
      .week-switcher { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; margin-top: 13px; }
      .week-switcher button { min-height: 42px; border: 0; border-radius: 11px; background: var(--surface-alt); color: var(--accent-strong); font-weight: 800; cursor: pointer; }
      .week-switcher button:disabled { opacity: .35; cursor: default; }
      .week-switcher .current-week-button { justify-self: center; min-height: 40px; padding: 6px 14px; border-radius: 999px; }
      .week-switcher > span { text-align: center; color: var(--dim); font-size: 11px; font-weight: 700; }
      .week-stat-grid { display: grid; grid-template-columns: .85fr .95fr 1.3fr; gap: 8px; margin-top: 16px; }
      .week-stat-grid > div { min-width: 0; padding-right: 8px; border-right: 1px solid var(--border); }
      .week-stat-grid > div:last-child { border-right: 0; padding-right: 0; }
      .week-stat-grid span, .week-stat-grid small { display: block; color: var(--dim); font-size: 10px; line-height: 1.2; }
      .week-stat-grid strong { display: block; margin: 3px 0 1px; font-size: 18px; line-height: 1.1; letter-spacing: -.02em; }
      .week-stat-grid .pace-stat strong { color: var(--accent-strong); }
      .week-progress { height: 7px; border-radius: 999px; background: #e5ece6; overflow: hidden; margin-top: 16px; }
      .week-progress i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
      .week-total { color: var(--dim); font-size: 11px; margin: 7px 0 0; }
      .week-total strong { color: var(--text); }
      .hero-topline { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
      .hero-number { font-size: clamp(42px, 14vw, 68px); line-height: .92; letter-spacing: -0.055em; font-weight: 780; }
      .hero-label { color: var(--dim); margin-top: 7px; font-size: 14px; font-weight: 600; }
      .remaining { margin-top: 9px; font-size: 15px; font-weight: 750; color: var(--accent-strong); }
      .remaining.over { color: var(--warm); }
      .macro-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 24px; }
      .macro-row div { display: flex; flex-direction: column; border-top: 1px solid rgba(25, 55, 46, .18); padding-top: 10px; }
      .macro-row strong { font-size: 20px; letter-spacing: -.02em; }
      .macro-row span { font-size: 12px; color: var(--dim); margin-top: 1px; }
      .history-section { margin-top: 18px; touch-action: pan-y; }
      .history-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin: 0 2px 10px; }
      .history-heading h2 { font-size: 19px; letter-spacing: -.02em; margin: 0; font-weight: 750; }
      .history-heading p { color: var(--dim); font-size: 12px; margin: 3px 0 0; }
      .history-averages { display: flex; gap: 12px; text-align: right; }
      .history-averages span { color: var(--dim); font-size: 10px; line-height: 1.2; }
      .history-averages strong { color: var(--text); display: block; font-size: 13px; }
      .history-days { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); overflow: hidden; }
      .history-day { width: 100%; min-height: 44px; display: grid; grid-template-columns: 74px minmax(34px, 1fr) 76px 52px; align-items: center; gap: 8px; border: 0; border-bottom: 1px solid #edf1ed; background: transparent; padding: 8px 11px; text-align: left; cursor: pointer; font: inherit; color: inherit; }
      .history-day:last-child { border-bottom: 0; }
      .history-day.active { background: var(--surface-alt); }
      .history-day:disabled { opacity: .5; cursor: default; }
      .history-date { font-size: 12px; font-weight: 750; }
      .history-bar { height: 6px; border-radius: 999px; background: #e5ece6; overflow: hidden; }
      .history-bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
      .history-total { font-size: 11px; font-weight: 750; text-align: right; white-space: nowrap; }
      .history-protein { color: var(--dim); font-size: 10px; text-align: right; white-space: nowrap; }
      .meal-list { display: grid; gap: 12px; }
      @media (min-width: 720px) { .meal-list { grid-template-columns: 1fr 1fr; align-items: start; } }
      .meal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; box-shadow: 0 4px 14px rgba(31, 71, 57, .04); }
      .meal-header { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 14px 12px 18px; }
      .meal-header h2 { font-size: 19px; letter-spacing: -.02em; margin: 0; font-weight: 750; }
      .meal-header div > span { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
      .master-toggle { display: flex; align-items: center; gap: 8px; border-radius: 999px; background: var(--surface-alt); padding: 8px 11px; color: var(--accent-strong); font-size: 12px; font-weight: 750; cursor: pointer; }
      .master-toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
      .food-rows { border-top: 1px solid var(--border); }
      .food-row { min-height: 62px; display: block; padding: 0 12px 0 14px; border-bottom: 1px solid #edf1ed; }
      .food-row:last-child { border-bottom: 0; }
      .food-row.selected { background: #f4f9f4; }
      .food-row-main { min-height: 62px; display: flex; align-items: center; gap: 10px; }
      .food-check { display: flex; align-items: center; cursor: pointer; flex: 0 0 auto; }
      .food-check input { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; flex: 0 0 24px; margin: 0; border: 1.5px solid #b7c8bc; border-radius: 8px; display: grid; place-items: center; background: white; cursor: pointer; }
      .food-check input::after { content: "✓"; color: transparent; font-size: 14px; font-weight: 900; }
      .food-check input:checked { background: var(--accent); border-color: var(--accent); }
      .food-check input:checked::after { color: white; }
      .food-summary { min-width: 0; flex: 1; border: 0; background: transparent; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; text-align: left; cursor: pointer; font: inherit; color: inherit; }
      .food-copy { display: flex; flex-direction: column; min-width: 0; }
      .food-copy strong { font-size: 14px; line-height: 1.25; }
      .food-copy small { color: var(--dim); font-size: 11px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .food-glance { flex: 0 0 auto; display: grid; grid-template-columns: 42px 54px 42px; align-items: center; gap: 3px; color: var(--dim); font-size: 10px; text-align: right; white-space: nowrap; }
      .food-glance b { color: var(--accent-strong); font-size: 11px; }
      .food-details { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 0 10px 34px; }
      .quantity-control { display: grid; grid-template-columns: 38px minmax(24px, auto) 38px; align-items: center; gap: 2px; background: #e6f0e7; border-radius: 12px; padding: 3px; flex: 0 0 auto; }
      .quantity-control button { width: 38px; height: 38px; border: 0; background: transparent; border-radius: 9px; color: var(--accent-strong); font-size: 20px; cursor: pointer; }
      .quantity-control span { text-align: center; font-size: 13px; font-weight: 800; }
      .row-edit-button { min-height: 40px; border: 0; border-radius: 10px; background: var(--surface-alt); color: var(--accent-strong); padding: 8px 12px; font-size: 12px; font-weight: 800; cursor: pointer; }
      .source-link { display: block; border-top: 1px solid var(--border); padding: 10px 14px; color: var(--accent-strong); font-size: 11px; font-weight: 700; text-decoration: none; }
      .estimate-note { color: var(--dim); font-size: 12px; line-height: 1.5; margin: 18px 4px 0; }

      /* ---------- sheets / forms ---------- */
      .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(18, 41, 33, .3); padding-top: 24px; }
      @media (min-width: 720px) { .modal-backdrop { align-items: center; padding: 24px; } }
      .sheet { width: min(640px, 100%); max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); overflow-y: auto; background: var(--bg); border-radius: 26px 26px 0 0; padding: 18px 16px max(28px, env(safe-area-inset-bottom)); box-shadow: 0 -14px 45px rgba(15, 45, 35, .16); }
      @media (min-width: 720px) { .sheet { margin-bottom: 24px; border-radius: 26px; max-height: calc(100vh - 48px); } }
      .small-sheet { width: min(480px, 100%); }
      .sheet-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
      .sheet-header h2 { font-size: 23px; margin: 0; font-weight: 750; }
      .sheet-header p { color: var(--dim); font-size: 13px; margin: 3px 0 0; }
      .sheet-header > button { border: 0; background: var(--surface-alt); border-radius: 50%; width: 42px; height: 42px; font-size: 24px; line-height: 1; cursor: pointer; flex: 0 0 auto; }
      .form-stack, .food-form { display: grid; gap: 14px; }
      .form-stack label, .food-form label { display: grid; gap: 6px; color: var(--dim); font-size: 12px; font-weight: 700; }
      .form-stack input, .food-form input, .food-form select, .form-stack select, .form-stack textarea, .food-form textarea {
        width: 100%; min-height: 46px; border: 1px solid var(--border); border-radius: 12px;
        background: var(--surface); color: var(--text); padding: 10px 12px; outline: none;
      }
      .form-stack textarea, .food-form textarea { min-height: 0; resize: vertical; }
      .form-stack input:focus, .food-form input:focus, .food-form select:focus, .form-stack select:focus, .form-stack textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47, 117, 95, .12); }
      .primary-button { min-height: 50px; border: 0; border-radius: 14px; background: var(--accent); color: white; font-weight: 800; cursor: pointer; width: 100%; }
      .primary-button:disabled { opacity: .55; }
      .number-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .inline-check { display: flex !important; align-items: center; gap: 10px !important; background: var(--surface-alt); padding: 12px; border-radius: 12px; color: var(--text) !important; }
      .inline-check input { width: 18px !important; min-height: 18px !important; accent-color: var(--accent); box-shadow: none !important; }
      .catalog-list { display: grid; gap: 22px; }
      .catalog-group-title { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding: 0 2px 8px; }
      .catalog-group-title h3 { margin: 0; font-size: 16px; }
      .catalog-group-title button { border: 0; background: transparent; color: var(--accent-strong); font-weight: 700; cursor: pointer; }
      .catalog-item-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; border-bottom: 1px solid #e8eee9; }
      .catalog-item { min-width: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; padding: 12px 2px; cursor: pointer; font: inherit; color: inherit; }
      .catalog-item span:first-child { display: grid; gap: 2px; min-width: 0; }
      .catalog-item strong { font-size: 14px; }
      .catalog-item small { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .catalog-item > span:last-child { color: var(--dim); font-size: 12px; white-space: nowrap; }
      .catalog-actions { display: flex; align-items: center; gap: 7px; }
      .usual-button, .remove-food-button, .keep-button, .confirm-remove-button { border: 0; min-height: 40px; padding: 8px 12px; font-size: 12px; font-weight: 800; white-space: nowrap; cursor: pointer; }
      .usual-button { border-radius: 999px; background: var(--surface-alt); color: var(--accent-strong); }
      .usual-button.included { background: var(--accent); color: white; }

      /* ================= verdict & goals ================= */
      function renderVerdict() {
        var today = todayToronto();
        var lastMonday = addDays(mondayOf(today), -7);
        var lastSunday = addDays(lastMonday, 6);
        var html = backBar("Weekly verdict", "var(--accent)");
        html += '<p style="margin:10px 2px 0;font-size:14px;color:var(--dim)">Week of ' + shortDate(lastMonday) + " – " + shortDate(lastSunday) + ". Judged fairly — then closed.</p>";
        var scores = [];
        WORLD_KEYS.forEach(function (w) {
          var ws = weekScore(w, lastMonday, today);
          scores.push(ws.score);
          html += '<section class="panel-card" style="margin-top:12px"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px"><span class="world-name">' + WORLD_NAMES[w] + '</span><span class="world-score" style="color:' + WORLD_ACCENTS[w] + '">' + (ws.score === null ? "—" : ws.score) + "</span></div>" +
            '<p style="margin:6px 0 0;font-size:14px;color:var(--dim)">' + (ws.elapsedDays ? ws.winDays + " of " + ws.elapsedDays + " days won" : "No data that week") + "</p></section>";
        });
        var known = scores.filter(function (s) { return s !== null; });
        var avg = known.length ? Math.round(known.reduce(function (a, b) { return a + b; }, 0) / known.length) : null;
        html += '<section class="week-overview" style="margin-top:12px" aria-label="The verdict"><p class="mini-label">The verdict</p>' +
          '<p style="margin:8px 0 0;font-size:15px;line-height:1.6">' + (avg === null ? "Not enough data last week to judge — the board starts where you do." : avg >= 70 ? "A strong week: " + avg + " across the worlds. It's banked — XP from it never comes back off." : avg >= 50 ? "A real week: " + avg + " across the worlds. Not perfect, and it counts — the streak and the XP both kept it." : "A hard week: " + avg + " across the worlds. Bad weeks expire — this one is closed now, and the bar for this week is just the next small win.") + "</p></section>";

      /* ================= render dispatch ================= */
      function render() {
        appEl.className = "page-frame";
        sheetEl.innerHTML = "";
        if (!DB) { renderAuth(); return; }
        var v = ui.view;
        if (v.kind === "home") renderHome();
        else if (v.kind === "world") renderWorldDetail(v.world);
        else if (v.kind === "nutrition") renderNutrition();
        else if (v.kind === "spending") renderSpending();
        else if (v.kind === "fitness") renderFitness();
        else if (v.kind === "journal") renderJournal();
        else if (v.kind === "verdict") renderVerdict();
        else if (v.kind === "goals") renderGoals();
        else renderHome();
        window.scrollTo(0, 0);
      }
      function go(view) { ui.view = view; ui.message = ""; render(); }

      /* ================= events ================= */
      document.addEventListener("click", function (e) {
        var t = e.target.closest("[data-act]");
        if (!t) return;
        var act = t.getAttribute("data-act");
        var today = todayToronto();
        switch (act) {
          case "go-home": go({ kind: "home" }); break;
          case "open-world": go({ kind: "world", world: t.getAttribute("data-world") }); break;
          case "open-nutrition": ui.nut.date = todayToronto(); ui.nut.weekStart = trackingWeekStart(ui.nut.date); go({ kind: "nutrition" }); break;
          case "open-spending": go({ kind: "spending" }); break;
          case "open-fitness": go({ kind: "fitness" }); break;
          case "open-journal": go({ kind: "journal" }); break;
          case "open-verdict": go({ kind: "verdict" }); break;
          case "open-goals": go({ kind: "goals" }); break;
          case "sign-out":
            if (sb) sb.auth.signOut().then(function () { session = null; DB = null; renderAuth(); });
            break;
          case "auth-github":
            ui.authError = ""; ui.authBusy = true; renderAuth();
            sb.auth.signInWithOAuth({ provider: "github", options: { redirectTo: window.location.href.split("#")[0].split("?")[0] } }).then(function (res) {
              if (res.error) { ui.authBusy = false; ui.authError = res.error.message; renderAuth(); }
            });
            break;
          case "auth-signup": {
            var em = document.getElementById("auth-email"), pw = document.getElementById("auth-pass");
            if (!em || !pw || !em.value || !pw.value) { ui.authError = "Enter an email and a password first."; renderAuth(); break; }
            ui.authBusy = true; ui.authError = ""; renderAuth();
            sb.auth.signUp({ email: em.value.trim(), password: pw.value }).then(function (res) {
              ui.authBusy = false;
              if (res.error) { ui.authError = res.error.message; renderAuth(); return; }
              if (res.data.session) { session = res.data.session; boot(); }
              else { ui.authNotice = "Account created — check your email to confirm, then sign in."; renderAuth(); }
            });
            break;
          }
          case "dismiss-message": ui.message = ""; render(); break;
          /* nutrition */
          case "nut-prev": chooseNutDate(addDays(ui.nut.date, -1)); break;
          case "nut-next": chooseNutDate(addDays(ui.nut.date, 1)); break;
          case "nut-goto": chooseNutDate(t.getAttribute("data-date")); break;
          case "nut-week-prev": moveNutWeek(-1); break;
          case "nut-week-next": moveNutWeek(1); break;
          case "nut-week-current": ui.nut.weekStart = trackingWeekStart(localDateString()); render(); break;
          case "nut-expand": { var fid = Number(t.getAttribute("data-food")); ui.nut.expanded = ui.nut.expanded === fid ? null : fid; render(); break; }
          case "nut-inc": { var f2 = Number(t.getAttribute("data-food")); setNutQty(ui.nut.date, f2, Math.round((nutQty(ui.nut.date, f2) + 0.5) * 2) / 2); render(); break; }
          case "nut-dec": { var f3 = Number(t.getAttribute("data-food")); setNutQty(ui.nut.date, f3, Math.max(0, Math.round((nutQty(ui.nut.date, f3) - 0.5) * 2) / 2)); render(); break; }
          case "nut-edit-item": {
            var f4 = foodById(Number(t.getAttribute("data-food")));
            if (f4) { ui.nut.draft = { id: f4.id, groupId: f4.groupId, name: f4.name, servingLabel: f4.servingLabel, calories: String(f4.calories), protein: String(f4.protein), carbs: String(f4.carbs), fat: String(f4.fat), defaultQuantity: String(f4.defaultQuantity), masterIncluded: f4.masterIncluded }; ui.nut.sheet = "catalog"; renderSheet(); }
            break;
          }
          case "nut-target-open": ui.nut.sheet = "target"; renderSheet(); break;
          case "nut-catalog-open": ui.nut.sheet = "catalog"; ui.nut.draft = null; ui.nut.removeId = null; renderSheet(); break;
          case "sheet-close": ui.nut.sheet = null; ui.nut.draft = null; ui.nut.removeId = null; renderSheet(); break;
          case "sheet-backdrop": if (e.target === t) { ui.nut.sheet = null; ui.nut.draft = null; ui.nut.removeId = null; renderSheet(); } break;
          case "cat-back": ui.nut.draft = null; renderSheet(); break;
          case "cat-add": ui.nut.draft = { groupId: Number(t.getAttribute("data-group")), name: "", servingLabel: "1 serving", calories: "", protein: "", carbs: "", fat: "", defaultQuantity: "1", masterIncluded: false }; renderSheet(); break;
          case "cat-edit": {
            var f5 = foodById(Number(t.getAttribute("data-food")));
            if (f5) { ui.nut.draft = { id: f5.id, groupId: f5.groupId, name: f5.name, servingLabel: f5.servingLabel, calories: String(f5.calories), protein: String(f5.protein), carbs: String(f5.carbs), fat: String(f5.fat), defaultQuantity: String(f5.defaultQuantity), masterIncluded: f5.masterIncluded }; ui.nut.removeId = null; renderSheet(); }
            break;
          }
          case "cat-usual": {
            var f6 = foodById(Number(t.getAttribute("data-food")));
            if (f6) { f6.masterIncluded = !f6.masterIncluded; saveSection("nutrition"); ui.message = f6.masterIncluded ? f6.name + " added to your usual meal." : f6.name + " removed from your usual meal."; render(); }
            break;
          }
          case "cat-hide": ui.nut.removeId = Number(t.getAttribute("data-food")); renderSheet(); break;
          case "cat-keep": ui.nut.removeId = null; renderSheet(); break;
          case "cat-hide-confirm": {
            var f7 = foodById(Number(t.getAttribute("data-food")));
            if (f7) { f7.hidden = true; saveSection("nutrition"); ui.nut.removeId = null; ui.nut.draft = null; ui.message = f7.name + " hidden from future days. Saved past logs still show it."; render(); }
            break;
          }
          /* fitness */
          case "fit-weight": {
            var inp = document.getElementById("fit-weight");
            var v = inp ? Number(inp.value) : NaN;
            if (Number.isFinite(v) && v > 0) {
              var lg = fitnessLog(today) || { workout: null, weightKg: null };
              lg.weightKg = v; DB.fitness.logs[today] = lg; ui.fitWeight = String(v); saveSection("fitness"); render();
            }
            break;
          }
          case "fit-workout": {
            var w = t.getAttribute("data-w");
            var lg2 = fitnessLog(today) || { workout: null, weightKg: null };
            lg2.workout = lg2.workout === w ? null : w; DB.fitness.logs[today] = lg2; saveSection("fitness"); render();
            break;
          }
          /* french */
          case "fr-add": {
            var mins = Number(t.getAttribute("data-min")) || 0;
            var fl = frenchLog(today) || { minutes: 0, drill: false };
            fl.minutes = (fl.minutes || 0) + mins; DB.french.logs[today] = fl; saveSection("french"); render();
            break;
          }
          case "fr-custom": {
            var ci = document.getElementById("fr-custom");
            var cv = ci ? Number(ci.value) : NaN;
            if (Number.isFinite(cv) && cv > 0) {
              var fl2 = frenchLog(today) || { minutes: 0, drill: false };
              fl2.minutes = (fl2.minutes || 0) + Math.round(cv); DB.french.logs[today] = fl2; saveSection("french"); render();
            }
            break;
          }
          case "fr-drill": {
            var fl3 = frenchLog(today) || { minutes: 0, drill: false };
            fl3.drill = !fl3.drill; DB.french.logs[today] = fl3; saveSection("french"); render();
            break;
          }
          /* spending */
          case "sp-check": DB.spending.checked = DB.spending.checked || {}; DB.spending.checked[today] = true; saveSection("spending"); render(); break;
          case "sp-add-toggle": ui.spend.showAdd = !ui.spend.showAdd; render(); break;
          case "sp-focus-toggle": ui.spend.showFocus = !ui.spend.showFocus; render(); break;
          case "sp-cat": { var c = t.getAttribute("data-cat"); ui.spend.category = ui.spend.category === c ? null : c; render(); break; }
          case "sp-cat-clear": ui.spend.category = null; render(); break;
          /* journal */
          case "line-form-toggle": ui.journalShowForm = !ui.journalShowForm; render(); break;
        }
      });
      document.addEventListener("change", function (e) {
        var t = e.target;
        var act = t.getAttribute && t.getAttribute("data-act-change");
        if (act === "nut-toggle") {
          var fid = Number(t.getAttribute("data-food"));
          var f = foodById(fid);
          if (f) { setNutQty(ui.nut.date, fid, t.checked ? f.defaultQuantity : 0); render(); }
          return;
        }
        if (act === "nut-meal") {
          var gid = Number(t.getAttribute("data-group"));
          var group = DB.nutrition.groups.filter(function (g) { return g.id === gid; })[0];
          if (group) {
            group.items.forEach(function (item) {
              if (!item.masterIncluded || item.hidden) return;
              setNutQty(ui.nut.date, item.id, t.checked ? item.defaultQuantity : 0);
            });
            render();
          }
          return;
        }
        if (t.id === "nut-date-input" && t.value) { chooseNutDate(t.value); }
      });
      document.addEventListener("submit", function (e) {
        var form = e.target;
        var kind = form.getAttribute && form.getAttribute("data-form");
        if (!kind) return;
        e.preventDefault();
        var today = todayToronto();
        if (kind === "auth") {
          var em = document.getElementById("auth-email"), pw = document.getElementById("auth-pass");
          if (!sb || !em || !pw) return;
          ui.authBusy = true; ui.authError = ""; renderAuth();
          sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value }).then(function (res) {
            ui.authBusy = false;
            if (res.error) { ui.authError = res.error.message; renderAuth(); return; }
            session = res.data.session; boot();
          });
        } else if (kind === "target") {
          var v = Number(document.getElementById("target-input").value);
          if (Number.isFinite(v) && v >= 500 && v <= 10000) {
            DB.nutrition.target = Math.round(v); saveSection("nutrition");
            ui.nut.sheet = null; render();
          }
        } else if (kind === "food") {
          var draft = ui.nut.draft; if (!draft) return;
          var name = document.getElementById("ff-name").value.trim();
          var serving = document.getElementById("ff-serving").value.trim();
          var nums = ["ff-cal", "ff-pro", "ff-carb", "ff-fat", "ff-dq"].map(function (id) { return Number(document.getElementById(id).value); });
          if (!name || !serving || nums.some(function (n) { return !Number.isFinite(n) || n < 0; }) || nums[4] <= 0) {
            ui.message = "Add a name, serving, and valid nutrition values."; ui.nut.sheet = null; ui.nut.draft = null; render(); return;
          }
          var groupId = Number(document.getElementById("ff-group").value);
          var usual = document.getElementById("ff-usual").checked;
          if (draft.id) {
            var existing = foodById(draft.id);
            if (existing) {
              var oldGroup = DB.nutrition.groups.filter(function (g) { return g.id === existing.groupId; })[0];
              existing.name = name; existing.servingLabel = serving; existing.calories = nums[0]; existing.protein = nums[1]; existing.carbs = nums[2]; existing.fat = nums[3]; existing.defaultQuantity = nums[4]; existing.masterIncluded = usual;
              if (existing.groupId !== groupId) {
                        if (oldGroup) oldGroup.items = oldGroup.items.filter(function (i) { return i.id !== existing.id; });
                        var newGroup = DB.nutrition.groups.filter(function (g) { return g.id === groupId; })[0];
                        var extrasIdx = (DB.nutrition.extraFoods || []).findIndex(function (i) { return i.id === existing.id; });
                        if (extrasIdx >= 0) DB.nutrition.extraFoods.splice(extrasIdx, 1);
                        existing.groupId = groupId; existing.hidden = false;
                        if (newGroup) newGroup.items.push(existing);
              }
            }
          } else {
            var maxId = 0;
            DB.nutrition.groups.forEach(function (g) { g.items.forEach(function (i) { maxId = Math.max(maxId, i.id); }); });
            (DB.nutrition.extraFoods || []).forEach(function (i) { maxId = Math.max(maxId, i.id); });
            var grp = DB.nutrition.groups.filter(function (g) { return g.id === groupId; })[0];
            if (grp) grp.items.push({ id: maxId + 1, groupId: groupId, name: name, servingLabel: serving, calories: nums[0], protein: nums[1], carbs: nums[2], fat: nums[3], defaultQuantity: nums[4], masterIncluded: usual });
          }

          var existingE = (DB.journal.entries || {})[today];
          var deeperQ = (DB.journal.deeperQuestions && DB.journal.deeperQuestions[today]) || (existingE && existingE.deeperQuestion) || null;
          if (m && r && df) {
            DB.journal.entries[today] = { mattered: m, realized: r, differently: df, deeperQuestion: deeperQ, deeperAnswer: dqEl ? dqEl.value.trim() || null : (existingE ? existingE.deeperAnswer : null), filedLine: existingE ? existingE.filedLine : null };
            saveSection("journal");
            ui.journalSaved = true; render();
            setTimeout(function () { ui.journalSaved = false; }, 3000);
          }
        } else if (kind === "line") {
          var q = document.getElementById("line-quote").value.trim();
          var mn = document.getElementById("line-meaning").value.trim();
          var rm = document.getElementById("line-remember").value.trim();
          var st = document.getElementById("line-situations").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
          if (q && mn && rm) {
            var maxL = 0; (DB.journal.lines || []).forEach(function (l) { maxL = Math.max(maxL, l.id || 0); });
            DB.journal.lines.unshift({ id: maxL + 1, date: today, quote: q, meaning: mn, remember: rm, situations: st });
            saveSection("journal");
            ui.journalShowForm = false; render();
          }
        } else if (kind === "goals") {
          var cal = Number(document.getElementById("goal-cal").value);
          var pro = Number(document.getElementById("goal-protein").value);
          var wo = Number(document.getElementById("goal-workouts").value);
          var fr = Number(document.getElementById("goal-french").value);
          if (Number.isFinite(cal) && cal >= 500 && cal <= 10000) { DB.nutrition.target = Math.round(cal); saveSection("nutrition"); }
          DB.goals.proteinTarget = Number.isFinite(pro) && pro >= 0 ? Math.round(pro) : DB.goals.proteinTarget;
          DB.goals.workoutsPerWeek = Number.isFinite(wo) && wo >= 1 && wo <= 7 ? Math.round(wo) : DB.goals.workoutsPerWeek;
          DB.goals.frenchMinutesPerDay = Number.isFinite(fr) && fr >= 1 && fr <= 240 ? Math.round(fr) : DB.goals.frenchMinutesPerDay;
          saveSection("goals");
          ui.goalsSaved = true; render();
          setTimeout(function () { ui.goalsSaved = false; }, 3000);
        }
      });

      /* ================= boot ================= */
      async function boot() {
        appEl.className = "page-frame";
        appEl.innerHTML = '<div class="loading">Opening your board…</div>';
        try {
          await loadData();
          ui.view = { kind: "home" };
          render();
        } catch (err) {
          appEl.innerHTML = '<div class="error-state">Your board couldn\'t load. <div><button type="button" class="pill-button" style="background:var(--accent);margin-top:12px" onclick="window.location.reload()">Try again</button></div></div>';
        }
      }
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible" || !session || !DB) return;
        if (ui.view.kind !== "home" && ui.view.kind !== "world") return;
        loadData().then(function () { render(); }).catch(function () { /* keep what's on screen */ });
      });
      if (!sb) {
        renderAuth();
      } else {
        sb.auth.getSession().then(function (res) {
          session = res.data.session;
          if (session) boot(); else renderAuth();
        }).catch(function () { renderAuth(); });
        sb.auth.onAuthStateChange(function (_event, sess) {
          if (!sess && session) { session = null; DB = null; renderAuth(); }
        });
      }
</script>
  </body>
</html>
